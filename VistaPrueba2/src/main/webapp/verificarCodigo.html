<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Código y Establecer Contraseña</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Toastify CSS & JS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script>
    async function actualizarPassword(event) {
      event.preventDefault();
      
      const correo = document.getElementById("correo").value;
      const codigo = document.getElementById("codigoVerificacion").value;
      const nuevaPassword = document.getElementById("nuevaPassword").value;
      const confirmarPassword = document.getElementById("confirmarPassword").value;
      
      // Validar que ningún campo esté vacío
      if (!correo || !codigo || !nuevaPassword || !confirmarPassword) {
        Toastify({
          text: "Por favor, completa todos los campos.",
          duration: 3000,
          gravity: "top",
          position: "right",
          backgroundColor: "#FF0000"
        }).showToast();
        return;
      }
      
      if (nuevaPassword !== confirmarPassword) {
        Toastify({
          text: "Las contraseñas no coinciden.",
          duration: 3000,
          gravity: "top",
          position: "right",
          backgroundColor: "#FF0000"
        }).showToast();
        return;
      }
      
      // Construir un objeto JSON con los datos
      const data = {
        correo: correo,
        codigoVerificacion: codigo,
        nuevaPassword: nuevaPassword,
        confirmarPassword: confirmarPassword
      };
      
      // Enviar la petición al endpoint de la API
      const response = await fetch("http://localhost:9526/api/auth/actualizarPassword", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      
      if (response.ok) {
        const result = await response.json();
        Toastify({
          text: result.message,
          duration: 3000,
          gravity: "top",
          position: "right",
          backgroundColor: "#4CAF50"
        }).showToast();
        setTimeout(() => {
          window.location.href = "/VistaPrueba2/InicioSesion.html";
        }, 3000);
      } else {
        const errorData = await response.json();
        Toastify({
          text: "Error: " + errorData.error,
          duration: 3000,
          gravity: "top",
          position: "right",
          backgroundColor: "#FF0000"
        }).showToast();
      }
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="bg-black rounded-xl shadow-2xl p-8 max-w-md w-full animate-fade-in">
    <form id="verificationForm" onsubmit="actualizarPassword(event)" method="post" novalidate>
      <h1 class="text-2xl font-bold text-yellow-500 mb-4">Verificar Código y Establecer Contraseña</h1>
      
      <div class="mb-4">
        <label for="correo" class="block text-sm font-medium text-yellow-500 mb-2">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500" required>
      </div>
      
      <div class="mb-4">
        <label for="codigoVerificacion" class="block text-sm font-medium text-yellow-500 mb-2">Código de Verificación</label>
        <input type="text" id="codigoVerificacion" name="codigoVerificacion" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500" required>
      </div>
      
      <div class="mb-4">
        <label for="nuevaPassword" class="block text-sm font-medium text-yellow-500 mb-2">Nueva Contraseña</label>
        <input type="password" id="nuevaPassword" name="nuevaPassword" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500" required>
      </div>
      
      <div class="mb-4">
        <label for="confirmarPassword" class="block text-sm font-medium text-yellow-500 mb-2">Confirmar Contraseña</label>
        <input type="password" id="confirmarPassword" name="confirmarPassword" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500" required>
      </div>
      
      <button type="submit" class="w-full bg-yellow-500 text-black py-3 rounded-lg font-semibold hover:bg-yellow-600">
        Actualizar Contraseña
      </button>
    </form>
  </div>
</body>
</html>
