<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>
  <!--  Tailwind CSS-->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Toastify CSS & JS-->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script>
    async function enviarCorreoRecuperacion(event) {
      event.preventDefault();
      const correo = document.getElementById("correo").value.trim();
      if (!correo) {
        Toastify({
          text: "Por favor, ingresa tu correo.",
          duration: 3000,
          gravity: "top",
          position: "right",
          backgroundColor: "#FF0000"
        }).showToast();
        return;
      }

      // Enviar datos como form-urlencoded
      const params = new URLSearchParams();
      params.append("correo", correo);

      // Deshabilitar el botón y mostrar el loader
      const submitBtn = document.querySelector("button[type='submit']");
      submitBtn.disabled = true;
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = "Enviando... <span class='loader'></span>";

      try {
        const res = await fetch("http://localhost:8080/VistaPrueba2/recuperarContrasena", {
          method: "POST",
          body: params
        });
        if (res.ok) {
          const data = await res.json();
          Toastify({
            text: data.message || "Se ha enviado un correo de recuperación.",
            duration: 3000,
            gravity: "top",
            position: "right",
            backgroundColor: "#4CAF50"
          }).showToast();
          setTimeout(() => {
            //window.location.href = "http://localhost:8080/VistaPrueba2/actualizarContrasena.html?correo=" + encodeURIComponent(correo);
        	  window.location.href = "/VistaPrueba2/InicioSesion.html"
          }, 3000);
        } else {
          const errorData = await res.json();
          Toastify({
            text: errorData.error || "Error al enviar el correo de recuperación.",
            duration: 3000,
            gravity: "top",
            position: "right",
            backgroundColor: "#FF0000"
          }).showToast();
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      } catch (error) {
        console.error("Error en el fetch:", error);
        Toastify({
          text: "Error al enviar la solicitud.",
          duration: 3000,
          gravity: "top",
          position: "right",
          backgroundColor: "#FF0000"
        }).showToast();
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    /* Loader spinner */
    .loader {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #3498db;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-left: 5px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-white flex items-center justify-center min-h-screen">
  <div class="bg-black rounded-xl shadow-2xl p-8 max-w-md w-full animate-fade-in">
    <h1 class="text-2xl font-bold mb-4 text-center text-yellow-500">Recuperar Contraseña</h1>
    <form id="recuperarForm" onsubmit="enviarCorreoRecuperacion(event)">
      <div class="mb-4">
        <label for="correo" class="block text-sm font-medium text-yellow-500 mb-2">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500" placeholder="Ingresa tu correo" required>
      </div>
      <button type="submit" class="w-full bg-yellow-500 text-black py-3 rounded-lg font-semibold hover:bg-yellow-600">
        Enviar correo de recuperación
      </button>
    </form>
  </div>
</body>
</html>
